;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
data_dir = ../web/static
default_envs= 
    ;ttgo-lora32-v1
    ;ttgo-lora32-1v6
    ;ttgo-lora32-v2
    ;ttgo-lora32-tbeam
    ;heltec-v2
    ;sparkfun-lora
    ; lopy4
    esp32-v3

[env]
extra_scripts = pre:pre_build_web.py
platform = https://github.com/platformio/platform-espressif32.git
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
;upload_port = /dev/cu.SLAB_USBtoUART
;monitor_port = /dev/cu.SLAB_USBtoUART
;upload_speed = 460800
monitor_speed = 115200
board_build.partitions = custompart.csv
lib_deps =
    ESP32Async/AsyncTCP @ 3.3.2
    ESP32Async/ESPAsyncWebServer @ 3.6.0
;   With latest espressif32 platform we need an unreleased version of ESPAsyncWebServer
;   as per https://github.com/me-no-dev/ESPAsyncWebServer/issues/1151
    LoRa@0.7.2
    https://github.com/jgromes/RadioLib#3682c6c9215891e3afb7672f1235fde1c3bd75fd
    https://github.com/jerkey/LoRaLayer2.git#fe9249b
    https://github.com/paidforby/AsyncSDServer#f0f1f0b60498f43f34fdc0b118dbe8d937910fab
    ESP8266 and ESP32 OLED driver for SSD1306 displays
    TinyGPSPlus@1.0.2
	  ArduinoJson

[env:ttgo-lora32-v1]
board = ttgo-lora32-v1
build_flags = -DTTGO_LORA_V1
              -DARDUINO_LORA
               -DHAS_OLED
              -I./src
              ; -DLL2_DEBUG

[env:ttgo-lora32-1v6]
board = ttgo-lora32-v1
build_flags = -DTTGO_LORA_1V6
              -DARDUINO_LORA
              -DHAS_OLED
              -I./src
              ;-DLL2_DEBUG

[env:ttgo-lora32-v2]
board = ttgo-lora32-v1
build_flags = -DTTGO_LORA_V2
              -DARDUINO_LORA
              -DHAS_OLED
              -I./src
            ; -DLL2_DEBUG
            
[env:ttgo-lora32-v2-rl]
board = ttgo-lora32-v1
build_flags = -DTTGO_LORA_V2
              -DRL_SX1276
              -DHAS_OLED
              -I./src
            ; -DLL2_DEBUG

[env:ttgo-lora32-tbeam]
board = ttgo-t-beam
build_flags = -DTTGO_TBEAM
              -DARDUINO_LORA
              -I./src
            ; -DLL2_DEBUG

[env:heltec-v2]
board = heltec_wifi_lora_32_V2
build_flags = -DHELTEC
              -DARDUINO_LORA
              -DHAS_OLED
              -I./src

[env:sparkfun-lora]
board = sparkfun_lora_gateway_1-channel
;upload_port = COM17
build_flags = -DSPARKFUN
              -DARDUINO_LORA
              -I./src
	        ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG

[env:lopy4]
board = lopy4
build_flags = -DLOPY4
              -DRL_SX1276
              -I./src
            ; -DDUAL_LORA
            ; -DLL2_DEBUG
[env:esp32-v3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = custompart.csv
build_flags = -DESP32_V3
              -DRL_SX1262
              -I./src
              -DLL2_DEBUG

[env:t-beam-supreme]
board = esp32-s3-devkitm-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = custompart.csv
build_flags = -DTBEAM_SUPREME
              -DRL_SX1262
              -I./src
